<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Keilah</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="page-header">
    <h1>Contact Me</h1>
    <p>Use this page to connect or leave a message.</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
    <section class="contact-layout">
        <div>
            <h2>Contact Information</h2>
            <p>Email: keilahwilliams6@gmail.com</p>
            <p>Location: Louisiana</p>
            <p>Interests: Art, cooking, music, travel, psychology, and leadership.</p>
        </div>

        <form>
            <h2>Send a Message</h2>

            <label for="name">Name:</label>
            <input id="name" type="text" placeholder="Enter your name">

            <label for="email">Email:</label>
            <input id="email" type="email" placeholder="Enter your email">

            <label for="topic">Favorite Topic:</label>
            <select id="topic">
                <option>Art</option>
                <option>Cooking</option>
                <option>Music</option>
                <option>Travel</option>
                <option>School</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" placeholder="Write your message here"></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>
</main>

<footer>
    <p>Created by Keilah Williams</p>
</footer>

</body>
</html>
